name: 'SecurityJourney Aspen'
description: 'CI connector for SecurityJourney Aspen'
author: 'SecurityJourney'

inputs:
  api_token:
    description: 'SecurityJourney API token'
    required: true
  api_domain:
    description: 'API domain override'
    required: false
    default: 'api.securityjourney.com'
  scan_results_path:
    description: 'Path to a SARIF or scanner JSON output file (Modes A, D)'
    required: false
  instruction_file_path:
    description: 'Path to an AI instruction file, or a directory containing one .md file (Modes A, B)'
    required: false
  cwes:
    description: 'JSON array of CWE IDs, e.g. ["CWE-79","CWE-89"] (Modes B, C)'
    required: false
  scanner_type:
    description: 'Override scanner detection: snyk, bandit, sonarqube, semgrep, etc.'
    required: false
  auto_commit:
    description: 'Commit updated instruction file back to branch (Modes A, B)'
    required: false
    default: 'true'
  commit_message:
    description: 'Custom commit message for the instruction file update'
    required: false
  exclude_git_metadata_fields:
    description: 'all to disable CWE recording, or JSON array of fields to omit: ["repo","username","prNumber"]'
    required: false
    default: '[]'
  enforce_training:
    description: 'Enable training-assignment enforcement gate (Mode E, or pre-check before Modes A-D)'
    required: false
    default: 'false'
  training_status_path:
    description: 'API path for training status checks'
    required: false
    default: '/integrations/training/assignment-status'
  training_required_assignments:
    description: 'Optional JSON array of assignment IDs/slugs required for compliance'
    required: false
  training_blocking_statuses:
    description: 'JSON array of response statuses that should block (used when API responds with a string status)'
    required: false
    default: '["incomplete","overdue","non_compliant","failed"]'
  training_fail_open:
    description: 'When true, allows the pipeline to continue if the training endpoint is unavailable/malformed'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Run Aspen
      # shell is required in composite action run steps — there is no runner default.
      # Selects pwsh on Windows and bash everywhere else.
      shell: ${{ runner.os == 'Windows' && 'pwsh' || 'bash' }}
      run: node ${{ github.action_path }}/dist/index.js
      env:
        ASPEN_API_TOKEN: ${{ inputs.api_token }}
        ASPEN_API_DOMAIN: ${{ inputs.api_domain }}
        ASPEN_SCAN_RESULTS_PATH: ${{ inputs.scan_results_path }}
        ASPEN_INSTRUCTION_FILE_PATH: ${{ inputs.instruction_file_path }}
        ASPEN_CWES: ${{ inputs.cwes }}
        ASPEN_SCANNER_TYPE: ${{ inputs.scanner_type }}
        ASPEN_AUTO_COMMIT: ${{ inputs.auto_commit }}
        ASPEN_COMMIT_MESSAGE: ${{ inputs.commit_message }}
        ASPEN_EXCLUDE_GIT_METADATA_FIELDS: ${{ inputs.exclude_git_metadata_fields }}
        ASPEN_ENFORCE_TRAINING: ${{ inputs.enforce_training }}
        ASPEN_TRAINING_STATUS_PATH: ${{ inputs.training_status_path }}
        ASPEN_TRAINING_REQUIRED_ASSIGNMENTS: ${{ inputs.training_required_assignments }}
        ASPEN_TRAINING_BLOCKING_STATUSES: ${{ inputs.training_blocking_statuses }}
        ASPEN_TRAINING_FAIL_OPEN: ${{ inputs.training_fail_open }}
        GITHUB_TOKEN: ${{ github.token }}
