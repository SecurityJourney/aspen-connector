name: Publish

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write # needed to create GitHub Release
  id-token: write # needed for --provenance (Sigstore OIDC attestation)

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    # Publishing runs in a protected environment (deploys restricted to release tags).
    environment: npm

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Verify registry signatures of installed dependencies before publishing.
      - name: Verify dependency signatures
        run: npm audit signatures

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      # --provenance attaches a signed build attestation (verify: npm audit signatures).
      # TODO: move to npm trusted publishing (OIDC) and drop NODE_AUTH_TOKEN.
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Creates a GitHub Release from the tag so action consumers can pin to it
      # via uses: SecurityJourney/aspen-connector@v1.0.0
      - name: Create GitHub Release
        run: gh release create ${{ github.ref_name }} --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
