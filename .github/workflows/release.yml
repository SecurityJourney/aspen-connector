name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write

jobs:
  release:
    name: Bump version and tag
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: trunk

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test

      - name: Configure git
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      # Bump package.json only — no auto-commit so we can update README first
      - name: Bump version
        run: npm version ${{ inputs.bump }} --no-git-tag-version

      # Update version references in README — GitHub Action format (@v1.0.0) and npm format (@1.0.0)
      - name: Update README version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          sed -i "s|aspen-connector@v[0-9]*\.[0-9]*\.[0-9]*|aspen-connector@v${VERSION}|g" README.md
          sed -i "s|aspen-connector@[0-9]*\.[0-9]*\.[0-9]*|aspen-connector@${VERSION}|g" README.md

      # Commit both files together and create the tag
      - name: Commit and tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git add package.json README.md
          git commit -m "v${VERSION}"
          git tag "v${VERSION}"

      # Pushes the commit and tag — the tag triggers publish.yml
      - name: Push
        run: git push origin trunk --follow-tags
