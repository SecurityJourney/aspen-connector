name: Release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options: [patch, minor, major]
permissions:
  contents: write
jobs:
  release:
    name: Bump version and tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: trunk
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run tests
        run: npm test
      # in order to bypass branch protections and push a new commit directly to trunk,
      # the ci job authenticates as the 'aspen-deloy-bot' github app
      - name: Commit Token
        id: commit
        uses: actions/create-github-app-token@v1
        with:
          app_id: '4135419'
          installation_id: '142393770'
          private_key: ${{ secrets.PUBLISH_TOKEN }}
      - name: Get app user id
        id: app-user
        run: |
          # resolve the app bot account's numeric id so the commit identity matches the pusher
          user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          echo "user_id=${user_id}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.commit.outputs.token }}
          APP_SLUG: aspen-deloy-bot
      - name: Setup for Commit
        shell: bash
        run: |
          set -e
          # commit identity matches the app that pushes, so bypass and any commit-author rules align
          git config --global user.name "aspen-deloy-bot[bot]"
          git config --global user.email "${USER_ID}+aspen-deloy-bot[bot]@users.noreply.github.com"
        env:
          USER_ID: ${{ steps.app-user.outputs.user_id }}
      # bump package.json only — no auto-commit so we can update readme first
      - name: Bump version
        run: npm version ${{ inputs.bump }} --no-git-tag-version
      # update version references in readme — github action format (@v1.0.0) and npm format (@1.0.0)
      - name: Update README version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          sed -i "s|aspen-connector@v[0-9]*\.[0-9]*\.[0-9]*|aspen-connector@v${VERSION}|g" README.md
          sed -i "s|aspen-connector@[0-9]*\.[0-9]*\.[0-9]*|aspen-connector@${VERSION}|g" README.md
      # commit both files together and create the tag
      - name: Commit and tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git add package.json README.md
          git commit -m "v${VERSION}"
          git tag -a "v${VERSION}" -m "v${VERSION}"
      # pushes the commit and tag — the tag triggers publish.yml
      # uses the app token so the push is authenticated as aspen-deloy-bot, which can bypass branch protection
      - name: Push
        run: git push "https://x-access-token:${{ steps.commit.outputs.token }}@github.com/${{ github.repository }}.git" trunk --follow-tags
