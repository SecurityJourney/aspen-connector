name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write

jobs:
  release:
    name: Bump version and tag
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: trunk

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test

      # In order to bypass branch protections and push a new commit directly to trunk,
      # the CI job needs to authorize itself using the 'svc-gha-release' GitHub App
      - name: Commit Token
        id: commit
        uses: actions/create-github-app-token@v1
        with:
          app_id: '4135419'
          installation_id: '142393770'
          private_key: ${{ secrets.PUBLISH_TOKEN }}

      - name: Setup for Commit
        shell: bash
        run: |
          set -e
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          # use the app to commit
          git remote add update https://x-access-token:${{ steps.commit.outputs.token }}@github.com/${GITHUB_REPOSITORY}
          git config --local --unset http.https://github.com/${GITHUB_REPOSITORY}.extraheader

      # Bump package.json only — no auto-commit so we can update README first
      - name: Bump version
        run: npm version ${{ inputs.bump }} --no-git-tag-version

      # Update version references in README — GitHub Action format (@v1.0.0) and npm format (@1.0.0)
      - name: Update README version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          sed -i "s|aspen-connector@v[0-9]*\.[0-9]*\.[0-9]*|aspen-connector@v${VERSION}|g" README.md
          sed -i "s|aspen-connector@[0-9]*\.[0-9]*\.[0-9]*|aspen-connector@${VERSION}|g" README.md

      # Commit both files together and create the tag
      - name: Commit and tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git add package.json README.md
          git commit -m "v${VERSION}"
          git tag "v${VERSION}"

      # Pushes the commit and tag — the tag triggers publish.yml
      # Uses the app token so the push is authenticated as svc-gha-release, which can bypass branch protection.
      - name: Push
        run: git push "https://x-access-token:${{ steps.commit.outputs.token }}@github.com/${{ github.repository }}.git" trunk --follow-tags
