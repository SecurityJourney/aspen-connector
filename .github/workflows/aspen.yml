name: Aspen Security Scan

on:
  pull_request:
    branches: [github_provider4]

jobs:
  aspen:
    name: Scan and update instructions
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed to diff against base branch

      - name: Install Snyk
        run: npm install -g snyk

      - name: Scan changed files
        run: |
          changed=$(git diff --name-only origin/${{ github.event.pull_request.base.ref }}...HEAD \
            | xargs -I{} sh -c '[ -e "{}" ] && echo "{}"')

          echo "Changed files: $changed"

          if [ -z "$changed" ]; then
            echo "No changed files — skipping scan"
            echo '{"runs":[]}' > scan.json
          else
            snyk code test . --sarif > scan.json || true
          fi
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - uses: SecurityJourney/aspen-connector@github_provider4
        with:
          api_token: ${{ secrets.SECURITYJOURNEY_TOKEN }}
          api_domain: api.securityjourney.dev
          scan_results_path: scan.json
          instruction_file_path: .github/CLAUDE.md
