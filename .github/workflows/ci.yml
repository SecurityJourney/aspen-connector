name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['**']   # publish.yml owns tags
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']   # test current LTS and latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Enforce the lockfile. --ignore-scripts prevents install-time code execution —
      # a common supply-chain attack vector in compromised transitive packages.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test
